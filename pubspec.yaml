name: gym_management_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.8.0-124.0.dev
dependencies:
  flutter:
    sdk: flutter
  #calendar
  calendar_view: ^1.4.0
  #dotenv
  flutter_dotenv: ^5.0.2

  #Supabase
  supabase_flutter: ^2.9.1

  #Estado global
  provider: ^6.1.5

  #Almacenamiento local seguro
  flutter_secure_storage: ^9.0.0

  #Utils
  cached_network_image: ^3.3.1
  crypto: ^3.0.6

  #Shared Preferences
  shared_preferences: ^2.2.2

  #Icons
  font_awesome_flutter: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - .env
  fonts:
    - family: Outfit
      fonts:
        - asset: fonts/Outfit-Regular.ttf
        - asset: fonts/Outfit-ExtraBold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/Inter_24pt-ExtraBoldItalic.ttf
          weight: 800
    - family: Lexend
      fonts:
        - asset: fonts/Lexend-Bold.ttf
          weight: 700

    - family: Nordic chance
      fonts:
        - asset: fonts/Nordic-Chance.ttf
          weight: 700

  uses-material-design: true
